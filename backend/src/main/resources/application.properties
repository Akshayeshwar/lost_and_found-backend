# ==============================================================================
# Campus Lost & Found - Base Application Configuration
# ==============================================================================
spring.application.name=lost-and-found

# Active Profile: Defaults to 'dev' for local developer convenience.
# In production containers / clouds, override with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server listen port
server.port=${PORT:8080}

# Security Mode: Enforce signed JWT authentication by default
app.security.dev-mode=${DEV_MODE:false}

# Allowed CORS Origins (dynamically configurable per environment)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# JWT Signing Secret (256-bit secure key) & Token Validity
app.jwt.secret=${JWT_SECRET:c2VjdXJlQ2FtcHVzTG9zdEFuZEZvdW5kSldUU2VjcmV0S2V5MjAyNkZvckFjYWRlbWljUHJvamVjdERlcGxveW1lbnQ=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# JPA Core Configuration
spring.jpa.open-in-view=false

# Structured Application Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework.web=INFO
logging.level.com.campus.lost_and_found=INFO
logging.level.org.hibernate.SQL=WARN
