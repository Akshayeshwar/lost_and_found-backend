# ==============================================================================
# Production Profile (application-prod.properties)
# Applied when SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Database Connection (strictly read from environment variables; no hardcoded defaults)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CRITICAL PRODUCTION SAFETY (Requirement 6):
# 'validate' verifies the existing table schema against JPA entity definitions
# and strictly PREVENTS Hibernate from dropping, altering, or creating tables!
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production Connection Pool Optimization (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:3}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Production Error Sanitization (Prevent information leakage)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Enforce JWT security mode in production
app.security.dev-mode=false
