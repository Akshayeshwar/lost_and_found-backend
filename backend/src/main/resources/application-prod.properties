# ==============================================================================
# Production Profile (application-prod.properties)
# Applied when SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Database Connection (supports Render DATABASE_URL or separate DB_URL / DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:${DATABASE_URL:}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate DDL in Production: defaults to 'update' so tables are safely initialized on fresh Render Postgres
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Allowed CORS Origins in Production (Vercel Frontend)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lost-and-found-frontend-chi.vercel.app,https://lost-and-found-frontend-chi.vercel.app/,http://localhost:5173}

# Production Connection Pool Optimization (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:3}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Production Error Sanitization (Prevent information leakage)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Enforce JWT security mode in production
app.security.dev-mode=false
