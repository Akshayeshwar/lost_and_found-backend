# ==============================================================================
# Development Profile (application-dev.properties)
# Used during local development and testing.
# ==============================================================================

# Database Connection with sensible local fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_lost_and_found?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL in Dev: update schema as entity models evolve
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Developer error details in development
server.error.include-message=always
server.error.include-stacktrace=never
